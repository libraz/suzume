[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suzume"
# Mirror of the version in the root CMakeLists.txt (single source of truth).
# scripts/check_version_mirror.sh gates drift.
version = "0.9.11"
description = "Lightweight Japanese tokenizer with POS tagging, lemmatization, and keyword extraction for Python"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "libraz", email = "libraz@libraz.net" },
]
readme = "README.md"
keywords = [
    "japanese",
    "japanese-tokenizer",
    "japanese-nlp",
    "morphological-analysis",
    "mecab",
    "tokenization",
    "nlp",
    "tokenizer",
    "pos-tagger",
    "part-of-speech",
    "lemmatization",
    "keyword-extraction",
    "search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://suzume.libraz.net"
Documentation = "https://suzume.libraz.net/docs/python"
Repository = "https://github.com/libraz/suzume"
Issues = "https://github.com/libraz/suzume/issues"

[project.scripts]
suzume = "suzume.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.rye]
managed = true
# Reuse the published `dev` extra rather than restating the tools here, so the
# wheel's metadata and the local dev environment cannot drift apart.
dev-dependencies = ["suzume[dev]"]

[tool.hatch.build.targets.wheel]
packages = ["src/suzume"]
# The compiled shared library and dictionaries are copied in by build_wheel.sh
# before packaging; force-include them so hatchling ships them in the wheel.
artifacts = [
    "src/suzume/*.dylib",
    "src/suzume/*.so",
    "src/suzume/*.dic",
    "src/suzume/py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
