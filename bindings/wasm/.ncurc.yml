# npm-check-updates config for @libraz/suzume (WASM binding).
#
# Routine dependency bump:
#   ncu               # preview available updates
#   ncu -u            # rewrite package.json to the latest allowed versions
#   yarn install      # apply + refresh yarn.lock
#
# `reject` holds packages deliberately pinned below their latest release.
# Add an entry (with the reason) whenever a package's newer version needs a
# Node newer than the mise / CI pin. That pin is Node 22.x (see mise.toml
# and node-version in .github/workflows/publish.yml);
# a bump there is what unblocks such packages.
#
# A reject only stops ncu from rewriting the range; the held package is also
# pinned exactly in package.json.
reject:
  # @biomejs/biome: 2.6.6 panics ("path is expected to be under the root" in the
  # ignore crate) on `biome check --config-path ../../examples/ts/biome.json`,
  # which `yarn lint` runs; 2.5.10 passes. Release the hold once a newer biome
  # fixes that invocation.
  - "@biomejs/biome"
