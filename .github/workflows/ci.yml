name: CI

on:
  push:
    branches: [main, develop]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# On develop, a new push supersedes any still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/wasm
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: bindings/wasm/yarn.lock
      - name: Install rye
        working-directory: .
        run: |
          curl -sSf https://rye.astral.sh/get | RYE_INSTALL_OPTION="--yes" RYE_NO_AUTO_INSTALL=0 bash
          echo "$HOME/.rye/shims" >> "$GITHUB_PATH"
      - run: yarn install --immutable
      - run: yarn lint
      - name: Lint MCP server and repository scripts
        working-directory: scripts/mcp
        run: |
          rye sync
          rye run ruff format --check . ../../scripts/*.py
          rye run ruff check . ../../scripts/*.py

  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Ratchet on hardcoded word tests / raw score literals / file length,
      # plus WASM-core purity (no unguarded file-I/O headers). See CLAUDE.md.
      - run: scripts/check_code_guardrails.sh
      - run: python3 scripts/check_oracle_overrides.py
      # A POS added to the C ABI must reach both bindings' label tables; the
      # C++ suite cannot see that gap.
      - run: python3 scripts/check_binding_labels.py
      # A V2 added to the core's compound lexicon must reach the oracle's mirror,
      # or expectations start splitting compounds the tokenizer joins.
      - run: python3 scripts/check_compound_v2_sync.py
      # Closed Unicode/grammar sets duplicated in the Python oracle must remain
      # exact mirrors of their C++ sources.
      - run: python3 scripts/check_oracle_mirrors.py
      # Version must stay in lockstep across every binding manifest.
      - run: scripts/check_version_mirror.sh

  mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MeCab and IPADIC
        run: |
          sudo apt-get update
          sudo apt-get install -y mecab libmecab-dev mecab-ipadic-utf8
          command -v mecab
      - name: Install rye
        run: |
          curl -sSf https://rye.astral.sh/get | RYE_INSTALL_OPTION="--yes" RYE_NO_AUTO_INSTALL=0 bash
          echo "$HOME/.rye/shims" >> "$GITHUB_PATH"
      # The oracle tests shell out to the native CLI for the Suzume side of every
      # comparison, so it must exist before pytest, not only for the sync check.
      - name: Build the native CLI and dictionaries
        run: make dict
      - name: Run MCP server and oracle tests
        working-directory: scripts/mcp
        run: |
          rye sync
          rye run pytest -q
      - name: Verify golden expectations are synchronized
        run: make oracle-sync-check

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ASan, LSan, and UBSan
        run: make asan

  # The published Linux wheel is compiled inside the manylinux image, whose GCC
  # is years older than the runner's. Without this job that compiler first meets
  # the code during the tag-triggered publish, which is past the point where a
  # release can be called off cleanly. Compile only: the wheel and its smoke test
  # stay in publish.yml, and both read the image from the same tracked file.
  manylinux-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile the core with the oldest supported toolchain
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/project" \
            --workdir /project \
            "$(cat scripts/manylinux-image.txt)" \
            /bin/bash -euxo pipefail -c '
              /opt/python/cp312-cp312/bin/python -m venv /tmp/suzume-toolchain
              source /tmp/suzume-toolchain/bin/activate
              python -m pip install --no-cache-dir "cmake==3.31.6"
              cmake -B build-manylinux -DBUILD_SHARED=ON -DBUILD_TESTING=OFF \
                -DCMAKE_BUILD_TYPE=Release -DENABLE_DEBUG_INFO=OFF -DENABLE_DEBUG_LOG=OFF
              cmake --build build-manylinux --target suzume_shared --parallel
            '

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned: the WASM size gate compares against a baseline recorded with this
      # exact toolchain, and emitted code size moves with the compiler. Bumping the
      # version means re-recording scripts/wasm-size-baseline.txt in the same commit.
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: bindings/wasm/yarn.lock
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build native and compile dictionaries
        run: |
          cmake -B build -DBUILD_WASM=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_C_FLAGS="--coverage"
          cmake --build build --parallel
          cmake --build build --target build-dict
      # The gtest binary is run once rather than through ctest: gtest_discover_tests
      # registers every case separately, so ctest spawns thousands of processes that
      # each reload the dictionaries. Tests that are not gtest cases still go through
      # ctest and must be named here.
      - name: Run C++ tests
        run: |
          ./build/bin/suzume_test
          ctest --test-dir build --output-on-failure -R native_cli_contract
      # Upload before any later step touches build/. `make examples-test` runs the
      # Makefile's own configure, which reconfigures that same directory from Debug
      # to Release and recompiles every object; the fresh .gcno files then no longer
      # match the .gcda the test binary just wrote, so the report would carry only
      # what the example programs executed.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Run in-tree and installed-package examples
        run: make examples-test consumer-smoke
      - name: Build WASM binding
        working-directory: bindings/wasm
        run: |
          yarn install --immutable
          yarn build
      - name: Check WASM size regression
        run: scripts/check_wasm_size.sh bindings/wasm/dist/suzume.wasm
      - name: Run WASM tests
        working-directory: bindings/wasm
        run: |
          yarn test
          yarn test:examples
      - name: Check native, Python, and WASM parity
        run: |
          make python-build
          pip install -e bindings/python
          python scripts/check_binding_parity.py

  python-binding:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Go through the Makefile rather than restating its cmake invocation here:
      # the binding loads the shared library AND reads the dictionaries staged
      # into the package, and python-dict is what stages them. A hand-copied
      # build step drifts from python-build and leaves the tests without data.
      - name: Build the shared C-ABI library and stage the dictionaries
        run: make python-build python-dict
      - name: Install Python binding
        working-directory: bindings/python
        run: pip install -e ".[dev]"
      - name: Lint and type-check
        working-directory: bindings/python
        run: |
          ruff check .
          ruff format --check .
          mypy src/suzume
      - name: Run Python tests
        working-directory: bindings/python
        run: |
          pytest -q
          python ../../examples/python/basic.py
