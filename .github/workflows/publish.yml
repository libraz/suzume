name: Publish and Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  # Must match UV_VERSION in ci.yml, so a release is built with the uv that CI
  # verified the wheel scripts against.
  UV_VERSION: "0.13.9"

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches the canonical version and all mirrors
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#v}"
          CMAKE_VERSION=$(grep -Eo 'project\(suzume VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$TAG_VERSION" != "$CMAKE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match CMakeLists.txt version ($CMAKE_VERSION)"
            exit 1
          fi
          scripts/check_version_mirror.sh

  # Both registries ship the core with the debug features compiled out, so the
  # suite must pass in that configuration as well as the default one.
  native-tests:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run native tests in the default and shipped configurations
        run: make native-test native-test-nodebug

  publish-npm:
    needs: [verify-version, native-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/wasm
    steps:
      - uses: actions/checkout@v7

      # Pinned to the same version as the CI size gate so a published artifact is
      # byte-comparable with the one the gate measured.
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11
      - run: corepack enable
      - run: corepack prepare yarn@4.18.0 --activate

      # The WASM link embeds the dictionaries the native CLI compiles.
      - name: Build native and compile dictionaries
        working-directory: ${{ github.workspace }}
        run: make dict

      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build
      - name: Check WASM size regression
        working-directory: ${{ github.workspace }}
        run: scripts/check_wasm_size.sh bindings/wasm/dist/suzume.wasm
      - run: yarn test
      - run: yarn test:examples
      - name: Publish to npm (skip if the version is already published)
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER already published, skipping."
          else
            npm publish --access public --provenance
          fi

  build-linux-wheel:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test manylinux2014 x86_64 wheel
        run: bindings/python/manylinux_wheel.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: bindings/python/dist/*.whl

  build-macos-wheel:
    needs: verify-version
    runs-on: macos-15  # arm64
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build macOS arm64 wheel
        working-directory: bindings/python
        run: ./build_wheel.sh
      - name: Smoke-test wheel outside the checkout
        run: |
          for wheel in bindings/python/dist/*.whl; do
            bindings/python/smoke_wheel.sh "$wheel"
          done
      - name: Run the binding test suite against the wheel
        run: |
          for wheel in bindings/python/dist/*.whl; do
            bindings/python/test_wheel.sh "$wheel"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-arm64
          path: bindings/python/dist/*.whl

  publish-pypi:
    needs: [native-tests, build-linux-wheel, build-macos-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/suzume
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Tolerate re-runs of the tag workflow after a partial failure:
          # wheels already on PyPI are skipped instead of failing the job.
          skip-existing: true

  github-release:
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
