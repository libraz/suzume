name: Publish and Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches the canonical version and all mirrors
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#v}"
          CMAKE_VERSION=$(grep -Eo 'project\(suzume VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$TAG_VERSION" != "$CMAKE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match CMakeLists.txt version ($CMAKE_VERSION)"
            exit 1
          fi
          scripts/check_version_mirror.sh

  publish-npm:
    needs: verify-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/wasm
    steps:
      - uses: actions/checkout@v7

      # Pinned to the same version as the CI size gate so a published artifact is
      # byte-comparable with the one the gate measured.
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11
      - run: corepack enable
      - run: corepack prepare yarn@4.18.0 --activate

      - name: Build native and compile dictionaries
        working-directory: ${{ github.workspace }}
        run: |
          cmake -B build -DBUILD_WASM=OFF
          cmake --build build --parallel
          cmake --build build --target build-dict

      # Run the gtest binary directly; ctest registers each case separately, so it
      # would spawn thousands of dictionary-loading processes. Non-gtest tests are
      # still driven by ctest and must be named here.
      - name: Run C++ tests
        working-directory: ${{ github.workspace }}
        run: |
          ./build/bin/suzume_test
          ctest --test-dir build --output-on-failure -R native_cli_contract

      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build
      - run: yarn test
      - name: Publish to npm (skip if the version is already published)
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "$PKG@$VER already published, skipping."
          else
            npm publish --access public --provenance
          fi

  build-linux-wheel:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and smoke-test manylinux2014 x86_64 wheel
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/project" \
            --workdir /project \
            "$(cat scripts/manylinux-image.txt)" \
            /bin/bash -euxo pipefail -c '
              /opt/python/cp312-cp312/bin/python -m venv /tmp/suzume-wheel-build
              source /tmp/suzume-wheel-build/bin/activate
              python -m pip install --no-cache-dir \
                "auditwheel==6.4.2" \
                "cmake==3.31.6" \
                "wheel==0.45.1"
              bindings/python/build_wheel.sh
              for wheel in bindings/python/dist/*.whl; do
                bindings/python/smoke_wheel.sh "$wheel"
              done
            '
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: bindings/python/dist/*.whl

  build-macos-wheel:
    needs: verify-version
    runs-on: macos-15  # arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install 'wheel==0.45.1'
      - name: Build macOS arm64 wheel
        working-directory: bindings/python
        run: ./build_wheel.sh
      - name: Smoke-test wheel outside the checkout
        run: |
          for wheel in bindings/python/dist/*.whl; do
            bindings/python/smoke_wheel.sh "$wheel"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-arm64
          path: bindings/python/dist/*.whl

  publish-pypi:
    needs: [build-linux-wheel, build-macos-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/suzume
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Tolerate re-runs of the tag workflow after a partial failure:
          # wheels already on PyPI are skipped instead of failing the job.
          skip-existing: true

  github-release:
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
